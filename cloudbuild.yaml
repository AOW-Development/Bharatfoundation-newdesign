build:
  service_account: "487191762139@cloudbuild.gserviceaccount.com"
  logs_bucket: "gs://my-logs-bucket"
steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nextjs-app:$COMMIT_SHA'
      - '.'

  # Step 2: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/nextjs-app:$COMMIT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'nextjs-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nextjs-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'PHONEPE_MERCHANT_ID=$_PHONEPE_MERCHANT_ID,PHONEPE_SALT_KEY=$_PHONEPE_SALT_KEY,PHONEPE_SALT_INDEX=$_PHONEPE_SALT_INDEX,NEXT_PUBLIC_BASE_URL=https://your-service-abc123-uc.a.run.app'

images:
  - 'gcr.io/$PROJECT_ID/nextjs-app:$COMMIT_SHA'

substitutions:
  _PHONEPE_MERCHANT_ID: 'PGTESTPAYUAT86'  # Replace with your actual value
  _PHONEPE_SALT_KEY: '96434309-7796-489d-8924-ab56988a6076'  # Replace with your actual value
  _PHONEPE_SALT_INDEX: '1'